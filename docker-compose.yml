version: "3.8"

services:
  web:
    image: php:8.2-apache
    container_name: sportsee
    ports:
      - "8050:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sportsee-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sportsee
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
